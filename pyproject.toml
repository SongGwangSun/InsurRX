[project]
name = "insurrx"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.11.6",
    "pydantic-settings==2.11.0",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "sqlalchemy[asyncio]==2.0.30",
    "langchain==0.3.25",
    "langchain-anthropic==0.3.15",
    "langchain-openai==0.3.16",
    "pinecone-client==3.2.2",
    "python-dotenv==1.0.1",
    "email-validator==2.1.1",
    "pdfplumber==0.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
# CI(.github/workflows/ci.yml)가 Python 3.10에서 돌기 때문에 3.10 문법 기준으로 검사
target-version = "py310"
extend-exclude = ["backend/.venv"]
src = [".", "backend"]

[tool.ruff.lint]
# 백그라운드 작업·CLI 루프·외부 API 경계에서는 의도적으로 Exception 전체를 잡아 기록한다
ignore = ["BLE001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입은 기본값에 함수 호출을 쓰는 것이 정상 패턴
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form",
    "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
]
