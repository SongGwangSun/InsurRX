name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject Formspree ID
        run: |
          FORMSPREE_ID="${{ secrets.FORMSPREE_FORM_ID }}"
          if [ -z "$FORMSPREE_ID" ]; then
            FORMSPREE_ID="__NOT_SET__"
          fi
          sed -i "s|__FORMSPREE_ID__|${FORMSPREE_ID}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
