name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# ── 프론트엔드: GitHub Pages ─────────────────────────────────────────────────
jobs:
  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject Formspree ID
        run: |
          FORMSPREE_ID="${{ secrets.FORMSPREE_FORM_ID }}"
          if [ -z "$FORMSPREE_ID" ]; then
            FORMSPREE_ID="__NOT_SET__"
          fi
          sed -i "s|__FORMSPREE_ID__|${FORMSPREE_ID}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ── 백엔드: Railway ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Railway GitHub 연동(자동 배포)이 이미 설정되어 있으므로 push 시 자동 배포됨
        # 이 단계는 railway up을 백업으로 시도하되 실패해도 워크플로 중단하지 않음
        continue-on-error: true
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "⚠ RAILWAY_TOKEN not set — skipping Railway deploy (Railway GitHub 연동으로 자동 배포됨)."
            exit 0
          fi
          railway up --service magnificent-celebration --detach
